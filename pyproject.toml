[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnaapler"
version = "1.3.0"
description = "Reorients assembled microbial sequences"
authors = [
    { name = "George Bouras", email = "george.bouras@adelaide.edu.au" }
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["microbial", "bioinformatics"]
requires-python = ">=3.8,<4.0"
dependencies = [
    "click>=8.0.0",
    "loguru>=0.5.3",
    "pyyaml>=6.0",
    "pandas>=1.4.2",
    "biopython>=1.76",
    "pyrodigal>=3.0.0",
]

[project.urls]
homepage = "https://github.com/gbouras13/dnaapler"
repository = "https://github.com/gbouras13/dnaapler"

[project.scripts]
dnaapler = "dnaapler:main"

[tool.isort]
profile = "black"

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.8,<4.0"
click = ">=8.0.0"
loguru = ">=0.5.3"
pyyaml = ">=6.0"
pandas = ">=1.4.2"
biopython = ">=1.76"
pyrodigal = ">=3.0.0"

[tool.pixi.pypi-dependencies]
dnaapler = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=6.2.5"
pytest-cov = ">=3.0.0"

[tool.pixi.feature.lint.dependencies]
black = ">=22.3.0"
isort = ">=5.10.1"
flake8 = ">=3.0.1"
hatch = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["test", "lint"], solve-group = "default" }

[tool.pixi.tasks]
fmt = { cmd = "black src tests && isort src tests", default-environment = "dev" }
check-fmt = { cmd = "black --check src tests && isort --check src tests", default-environment = "dev" }
lint = { cmd = "flake8 src tests", default-environment = "dev" }
test = { cmd = "pytest -vv tests/", default-environment = "dev" }
coverage = { cmd = "pytest --cov-report term --cov-report html --cov=dnaapler --cov-branch tests/", default-environment = "dev" }
build = { cmd = "hatch build", default-environment = "dev" }
